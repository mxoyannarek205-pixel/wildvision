<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0038b8"/>
      <stop offset="50%" style="stop-color:#7b2cbf"/>
      <stop offset="100%" style="stop-color:#e0112b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="200" fill="none"/>
  <text x="400" y="85" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="url(#grad)" text-anchor="middle" filter="url(#glow)" letter-spacing="8">WILD</text>
  <text x="400" y="155" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="#ffcc00" text-anchor="middle" filter="url(#glow)" letter-spacing="8">VISION</text>
  <text x="400" y="185" font-family="Arial, sans-serif" font-size="16" fill="#a99fc7" text-anchor="middle" letter-spacing="12">TIRASPOL 2026</text>
</svg>