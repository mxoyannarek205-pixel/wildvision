<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>Wildvision — сайт в разработке</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101114;
      color: #f5f5f5;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 0%, #27221e 0, #101114 58%);
    }

    main { width: min(100%, 760px); }

    .brand {
      margin: 0 0 12px;
      color: #f4a340;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 56px);
      line-height: 1.08;
      letter-spacing: -.04em;
    }

    .intro {
      margin: 16px 0 28px;
      color: #b7b7bd;
      font-size: 16px;
      line-height: 1.6;
    }

    .table-wrap {
      overflow: hidden;
      border: 1px solid #34353b;
      border-radius: 14px;
      background: #191a1f;
      box-shadow: 0 20px 70px #0005;
    }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 17px 20px; border-bottom: 1px solid #303138; }
    th { color: #90919a; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    td { font-size: 14px; line-height: 1.45; }
    tr:last-child td { border-bottom: 0; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #ffc36b;
      font-weight: 600;
      white-space: nowrap;
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: #f4a340; }
    footer { margin-top: 24px; color: #777982; font-size: 12px; text-align: center; }
    footer a { color: #a7a8af; text-decoration: none; }
    footer a:hover { color: #f4a340; }

    @media (max-width: 520px) {
      body { padding: 20px 14px; }
      th, td { padding: 14px 12px; }
      td { font-size: 13px; }
      th { font-size: 10px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">Wildvision · Tiraspol 2026</p>
    <h1>Сайт в разработке</h1>
    <p class="intro">Мы готовим обновлённый сайт. Загляните позже — скоро здесь появится больше информации о проекте.</p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th scope="col">Раздел</th>
            <th scope="col">Статус</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Публичный сайт</td>
            <td><span class="status"><span class="dot" aria-hidden="true"></span>В разработке</span></td>
          </tr>
          <tr>
            <td>Информация о проекте</td>
            <td><span class="status"><span class="dot" aria-hidden="true"></span>Скоро</span></td>
          </tr>
          <tr>
            <td>Новости и участники</td>
            <td><span class="status"><span class="dot" aria-hidden="true"></span>Скоро</span></td>
          </tr>
        </tbody>
      </table>
    </div>

    <footer>© Wildvision · Tiraspol 2026 · <a href="admin.html">Админка</a></footer>
  </main>
</body>
</html>
